[GENERAL]
# Emulate the meter type natively supported by a single Marstek Venus E.
DEVICE_TYPE = shellypro3em
SKIP_POWERMETER_TEST = False

# The Fronius Solar API is local and updates quickly. Limiting reads to one per
# second avoids unnecessary traffic while keeping the storage control responsive.
THROTTLE_INTERVAL = 1

[SCRIPT]
# The Fronius meter is installed at the load position and cannot see the Venus
# AC power. Reconstruct the real grid flow from Fronius P_Grid minus the local
# Marstek on-grid power, then expose that residual through the Shelly emulator.
COMMAND = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fronius_marstek_meter.ps1
