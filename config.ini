[GENERAL]
# Emulate the meter type natively supported by a single Marstek Venus E.
DEVICE_TYPE = shellypro3em
SKIP_POWERMETER_TEST = False

# The Fronius Solar API is local and updates quickly. Limiting reads to one per
# second avoids unnecessary traffic while keeping the storage control responsive.
THROTTLE_INTERVAL = 1

[JSON_HTTP]
# The Fronius meter is installed at the load position. Therefore use the
# inverter's calculated grid exchange instead of raw PowerReal_P_Sum.
# Positive P_Grid means grid import; negative means export.
URL = http://192.168.178.111/solar_api/v1/GetPowerFlowRealtimeData.fcgi
JSON_PATHS = $.Body.Data.Site.P_Grid
